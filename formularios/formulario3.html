<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <link rel="stylesheet" href="formulario3.css">
</head>
<body>
    <div class="central">
        <div class="header">
            <div class="imagen1">
                <img class="logo" src="/Imagenes/Frame14.svg" alt="Logo">
            </div>
        </div>

        <h2 class="titulo">Create password</h2>
        <p class="subtitulo">Use a minimum of 10 characters, including letters, lowercase letters, and numbers.</p>

        <form class="formulario">
            <label class="email1" for="email">Password</label>
            <div class="password-container">
            <input class="email2" type="email" id="email" name="email">
             </div>


            <label class="contraseña1" for="password">Confirm password</label>
            <div class="password-container">
                <input class="contraseña2" type="password" id="password" name="password">
            </div>
               

            <div class="email_button">
            <button class="btn-primary">Create acoount</button>
            </div>

              <p class="texto_registro">
                By creating an account, you agree with our <a class="azul" href="#">Terms and Conditions <span class="texto_registro">and</span> Privacy Statement.</a> 
            </p>
        </form>
    </div>
</body>
</html>
