<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <link rel="stylesheet" href="formulario4.css">
</head>
<body>
    <div class="central">
        <div class="header">
            <div class="imagen1">
                <img class="logo" src="/Imagenes/Frame14.svg" alt="Logo">
            </div>
        </div>

        <h2 class="titulo">Forgot your password?</h2>
        <p class="subtitulo">We’ll send you a link to reset it. Enter your email address used for My Dream Place</p>

        <form class="formulario">
            <label class="email1" for="email">Your email address</label>
            <input class="email2" type="email" id="email" name="email">
            

            <div class="email_button">
            <button class="btn-primary">Send Reset Link</button>
            </div>

            <p class="texto_registro">
                By creating an account, you agree with our <a class="azul" href="#">Terms and Conditions <span class="texto_registro">and</span> Privacy Statement.</a> 
            </p>
        </form>
    </div>
</body>
</html>
