<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <link rel="stylesheet" href="formulario1.css">
</head>
<body>
    <div class="central">
        <div class="header">
            <div class="imagen1">
                <img class="logo" src="/Imagenes/Frame14.svg" alt="Logo">
            </div>
        </div>

        <h2 class="titulo">Sign In</h2>

        <form class="formulario">
            <div class="campo1">
                <label class="email1" for="email">Email address</label>
                <input class="email2" type="email" id="email" name="email">
            </div>
            <div class="campo2">
                <label class="contraseña1" for="password">Password</label>
                <input class="contraseña2" type="password" id="password" name="password">
            </div>
                <div class="contraseña">
            </div>
                <div class="options3">
                    <div class="campo3">
                    <input class="casilla" type="checkbox"><label class="Marcar"> Keep me signed in</label>
                    </div>
                    <a href="#">Forgot password?</a>
                </div>

            <div class="email_button">
            <button class="btn-primary">Continue with email</button>
            </div>

            <div class="text_linea">
                <hr class="linea">
                <span class="texto5">or use one of these options</span>
            </div>
            
           <div>
            <button class="boton_google"><img src="/Imagenes/google.svg" alt="Logo Google">Continue with Google</button>
           </div>
           <div>
            <button class="boton_facebook"><img src="/Imagenes/facebook.svg" alt="Logo Facebook">Continue with Facebook</button>
           </div>

            <p class="texto_registro">
                Don’t have an account? <a href="#">Register</a>
            </p>
        </form>
    </div>
</body>
</html>
